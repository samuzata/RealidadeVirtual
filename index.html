<!DOCTYPE html>
<html lang = "pt-BR">

<head>
  <meta charset = "UTF-8">

    content = "width=device-with,initial-scale = 1">
  <title>REALIDADE VIRTUAL</title>
  <script src = "https://aframe.io/releases/1.6.0/aframe.min.js"> 
    </script>
</head>
<body>
  <a-scene>
  <!-- Desenhando o céu -->
    <a-sky color = "#FCCAF7"> </a-sky>
    <!-- Desenhando o chão -->
    <a-plane
      rotation = "-90 0 0"
      width="30"
      height="30"
      color="#228B22">
    </a-plane>
    <!-- Desenhando uma caixa -->
    <a-box
      position = "0 1.5 -4"
      rotation = "0 45 0"
      color = "#32024C"
      animation = "property: rotation";
      to:  0 405 0;
      loop: true;
      dur: 5000;
      
      ></a-box>
  </a-scene>
